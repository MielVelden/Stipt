name: Backoffice PR

on:
  pull_request:
    paths:
      - "Backoffice/**"
      - "Backend/**"
      - ".github/workflows/backoffice-pr.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Backoffice/package-lock.json

      - name: Install dependencies
        working-directory: Backoffice
        run: npm ci

      - name: Typecheck
        working-directory: Backoffice
        run: npm run typecheck

      - name: Build
        working-directory: Backoffice
        env:
          VITE_API_BASE_URL: /api
        run: npm run build
