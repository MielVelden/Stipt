name: Mobile PR

on:
  pull_request:
    paths:
      - "Mobile/**"
      - "Backend/**"
      - ".github/workflows/mobile-pr.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Install dependencies
        working-directory: Mobile
        run: npm ci

      - name: TypeScript validation
        working-directory: Mobile
        run: npx tsc --noEmit

      - name: Expo doctor
        working-directory: Mobile
        run: npx expo-doctor

      - name: Bundle export check
        working-directory: Mobile
        env:
          CI: "1"
        run: npx expo export --platform android --output-dir dist && npx expo export --platform ios --output-dir dist
